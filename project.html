<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="project.css">
    <title>Expense Tracker</title>
</head>
<body>
    
   
    
        <!-- Main Container -->
        <div class="container">
    
            <!-- ================= HEADER ================= -->
    
            <header class="header">
    
                <small>PERSONAL FINANCE</small>
    
                <h1>Expense Tracker</h1>
    
                <p>Keep an eye on your money.</p>
    
            </header>
    
    
            <!-- ================= DASHBOARD ================= -->
    
            <section class="summary">
    
                <!-- Balance Card -->
                <div class="card balance-card">
    
                    <p>Remaining Balance</p>
    
                    <h2 id="balance">₹0.00</h2>
    
                </div>
    
    
                <!-- Income Card -->
                <div class="card income-card">
    
                    <p>Total Income</p>
    
                    <h2 id="income">₹0.00</h2>
    
                </div>
    
    
                <!-- Expense Card -->
                <div class="card expense-card">
    
                    <p>Total Expenses</p>
    
                    <h2 id="expenses">₹0.00</h2>
    
                </div>
    
            </section>
    
    
            <!-- ================= MAIN CONTENT ================= -->
    
            <main class="main">
    
    
                <!-- LEFT SECTION: ADD TRANSACTION -->
    
                <section class="form-box">
    
                    <h3>Add Transaction</h3>
    
                    <!-- Transaction Form -->
                    <form id="transactionForm">
    
    
                        <!-- Description -->
                        <div class="form-group">
    
                            <label for="description">
                                Description
                            </label>
    
                            <input
                                type="text"
                                id="description"
                                placeholder="Enter description"
                                required
                            >
    
                        </div>
    
    
                        <!-- Amount -->
                        <div class="form-group">
    
                            <label for="amount">
                                Amount (₹)
                            </label>
    
                            <input
                                type="number"
                                id="amount"
                                placeholder="Enter amount"
                                min="0.01"
                                step="0.01"
                                required
                            >
    
                        </div>
    
    
                        <!-- Transaction Type -->
                        <div class="form-group">
    
                            <label for="type">
                                Transaction Type
                            </label>
    
                            <select id="type">
    
                                <option value="expense">
                                    Expense
                                </option>
    
                                <option value="income">
                                    Income
                                </option>
    
                            </select>
    
                        </div>
    
    
                        <!-- Category -->
                        <div class="form-group">
    
                            <label for="category">
                                Category
                            </label>
    
                            <select id="category">
    
                                <option value="Food">Food</option>
    
                                <option value="Travel">Travel</option>
    
                                <option value="Shopping">Shopping</option>
    
                                <option value="Salary">Salary</option>
    
                                <option value="Education">Education</option>
    
                                <option value="Entertainment">
                                    Entertainment
                                </option>
    
                                <option value="Other">Other</option>
    
                            </select>
    
                        </div>
    
    
                        <!-- Date -->
                        <div class="form-group">
    
                            <label for="date">
                                Date
                            </label>
    
                            <input
                                type="date"
                                id="date"
                                required
                            >
    
                        </div>
    
    
                        <!-- Submit Button -->
                        <button type="submit" class="add-btn">
    
                            Add Transaction
    
                        </button>
    
                    </form>
    
                </section>
    
    
                <!-- RIGHT SECTION: TRANSACTION HISTORY -->
    
                <section class="transactions-box">
    
                    <!-- Transaction Header -->
                    <div class="transaction-header">
    
                        <h3>Transactions</h3>
    
                        <!-- Transaction Filter -->
                        <select id="filter">
    
                            <option value="all">All</option>
    
                            <option value="income">Income</option>
    
                            <option value="expense">Expense</option>
    
                        </select>
    
                    </div>
    
    
                    <!-- Transaction List -->
                    <div id="transactionList">
    
                        <!--
                            Transactions will be added dynamically
                            using JavaScript.
                        -->
    
                    </div>
    
                </section>
    
    
            </main>
    
        </div>
   
    

    <script src="project.js"></script>
</body>
</html>
